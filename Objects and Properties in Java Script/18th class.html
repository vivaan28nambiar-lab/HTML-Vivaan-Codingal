<!DOCTYPE html>
<html>

<head>
    <title>Math Objects</title>
</head>

<body>
    <script type="text/javascript">

        var value = Math.abs(20);
        document.write("Demo test value : " + value + "<br>");

        var value = Math.acos(-1);
            document.write("Demo test value : " + value + "<br>");

            var value = Math.asin(1);
                document.write("Demo test value : " + value + "<br>");

                var value = Math.tan(.5);
                    document.write("Demo test value : " + value + "<br>");
    </script>

</body>

</html>
