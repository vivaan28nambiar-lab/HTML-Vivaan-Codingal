<!DOCTYPE html>
<html>

<head>
    <title>Methods in Array</title>
</head>

<body>
    <h2>Javascript Array Methods</h2>

    <h2>join() and pop()</h2>

    <p>The join() method joins the array elements into a string and pop() method removes the last element from an array.</p>

    <p id="myjoin"></p>
    <p id="myfirstpop"></p>
    <p id="mysecondpop"></p>

    <script>

        var fruits = [ "Apple", "Banana", "Orange", "Mango"]
        document.getElementById("myjoin").innerHTML = fruits.join(" , ")
        document.getElementById("myfirstpop").innerHTML = fruits;
        fruits.pop();
        fruits.pop();
        document.getElementById("mysecondpop").innerHTML = fruits;

    </script>

</body>

</html>
