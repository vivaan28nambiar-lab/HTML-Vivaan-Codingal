<!DOCTYPE html>
<html>
    <head>
        <title>Class in JS</title>
    </head>

    <body>
        <h2>Javascript Class Inheritance</h2>

        <p id="details"></p>
        <p1 id="greetings"></p1>

        <script>

            class Student {
                constructor(name) {
                    this.studentname = name;
                }
                present() {
                    return 'I am ' + this.studentname + 'from' 
                }
            }

        class Grade extends Student {
                constructor(name, grade) {
                    super(name);
                    this.studentGrade = grade;
                }

                show() {
                    return this.present() +  this.studentGrade;
                }
            }
        
        

        let myStudent = new Grade("Tina", "grade 6");
        document.getElementById("details").innerHTML =
        myStudent.show();

        // hello() is a static method cannot be accessed by object
        document.getElementById("greetings").innerHTML = Student.hello;
        </script>
    </body>
</html>
